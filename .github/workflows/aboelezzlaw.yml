# التحقّق الآلي لموقع مكتب أبو العز — مقصور على مجلّد aboelezzlaw/
#
# المستودع هذا نسخة من Remotion، فالموقع مشروع مستقلّ داخل مجلّد فرعي
# بملف قفل خاص به. المسارات في `paths` تمنع تشغيل هذا الفحص على تغييرات
# Remotion، كما تمنع فحوص Remotion من محاولة بناء الموقع.
name: aboelezzlaw

on:
  push:
    branches: ['claude/law-website-**']
    paths: ['aboelezzlaw/**', '.github/workflows/aboelezzlaw.yml']
  pull_request:
    paths: ['aboelezzlaw/**', '.github/workflows/aboelezzlaw.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: aboelezzlaw

jobs:
  checks:
    name: أنواع ولينت ووحدات وبناء
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aboelezzlaw/package-lock.json

      - run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: لينت
        run: npm run lint

      - name: اختبارات الوحدات
        run: npm run test:unit

      - name: بناء الإنتاج
        run: npm run build
        env:
          # البناء لا يحتاج أسراراً حقيقية؛ هذه قيم شكلية ليعمل الترميز
          AUTH_SECRET: ci-build-only-not-a-real-secret
          DOWNLOAD_SECRET: ci-build-only-not-a-real-secret

      - name: فحص الثغرات في الاعتماديات
        # الإنتاج لا يُنشر مع ثغرة عالية أو حرجة معروفة
        run: npm audit --audit-level=high

  integration:
    name: تكامل مقابل PostgreSQL حقيقي
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: aboelezz
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aboelezzlaw/package-lock.json

      - run: npm ci

      # المتصفّح يُنزَّل في وظيفة منفصلة؛ هنا نكتفي بمجموعات الخادم
      - name: اختبارات التكامل
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://app:app@127.0.0.1:5432/aboelezz
          SKIP_BROWSER: '1'

  browser:
    name: المتصفّح — تخطيط واتجاه وإمكانية وصول
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: aboelezz
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aboelezzlaw/package-lock.json

      - run: npm ci

      - name: تنزيل Chromium
        run: npx playwright install --with-deps chromium

      - name: فحص المتصفّح
        # المسار الافتراضي خاصّ ببيئة التطوير؛ في CI تتولّاه playwright
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://app:app@127.0.0.1:5432/aboelezz
          CHROMIUM_PATH: ''
          SKIP_SERVER_SUITES: '1'
